[package]
name = "genoa-settings"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "The GTK4 settings application for Genoa"

[dependencies]
gtk4 = { version = "0.11.1", features = ["v4_10"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3"
toml = "1.1"
uzers = "0.12"

[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
